<template>
  <h2>Timeline</h2>

  <demo-section id="tl-bound" title="Bound items and options" description="items, orientation and reverse follow the view-model.">
    <ej2-timeline data-testid="tl-bound" e-items.bind="items" e-orientation.bind="orientation" e-reverse.bind="reverse"></ej2-timeline>
    <div class="demo-row">
      <button data-testid="tl-horizontal" click.delegate="orientation = 'Horizontal'">Horizontal</button>
      <button data-testid="tl-vertical" click.delegate="orientation = 'Vertical'">Vertical</button>
      <label><input type="checkbox" data-testid="tl-reverse" checked.bind="reverse" /> reverse</label>
    </div>
  </demo-section>

  <demo-section id="tl-css" title="Custom item css" description="dotCss and cssClass are applied to each item.">
    <ej2-timeline data-testid="tl-css" e-items.bind="items"></ej2-timeline>
  </demo-section>

  <demo-section id="tl-align" title="Alignment" description="align After places the content after the dot.">
    <ej2-timeline data-testid="tl-align" e-items.bind="items" e-align="After"></ej2-timeline>
  </demo-section>
</template>
