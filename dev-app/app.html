<template>
  <require from="./app.css"></require>
  <div class="shell">
    <nav class="shell__nav" data-testid="nav" aria-label="Controls">
      <h1><a route-href="route: home">Aurelia · Syncfusion EJ2 Bridge</a></h1>
      <label class="theme-picker">Theme
        <select value.bind="theme" data-testid="theme-select">
          <option repeat.for="t of themes" value.bind="t">${t}</option>
        </select>
      </label>
      <input type="search" placeholder="Search controls" value.bind="filter & debounce:150" data-testid="nav-search" />
      <div class="nav-category" repeat.for="category of visibleCategories">
        <h2>${category.name}</h2>
        <a repeat.for="r of category.routes" route-href="route.bind: r.route" data-testid="nav-${r.route}">${r.title}</a>
      </div>
    </nav>
    <main class="shell__content">
      <router-view></router-view>
    </main>
    <aside class="event-log ${logOpen ? 'event-log--open' : ''}" data-testid="event-log">
      <header>
        <button type="button" data-testid="log-toggle" click.delegate="toggleLog()">Event log (${log.entries.length})</button>
        <button type="button" data-testid="log-clear" if.bind="logOpen" click.delegate="log.clear()">Clear</button>
      </header>
      <ol if.bind="logOpen" data-testid="log-entries">
        <li repeat.for="e of log.entries" class="event-log__${e.kind}">
          <time>${e.time}</time> <b>${e.control}</b> ${e.kind === 'event' ? 'on' : 'set'}<i>${e.name}</i> <code>${e.data}</code>
        </li>
      </ol>
    </aside>
  </div>
</template>
