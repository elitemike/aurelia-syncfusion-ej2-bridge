<template>
  <h2>Splitter</h2>

  <demo-section id="sp-horizontal" title="Horizontal with collapsible panes" description="Resize by dragging the bar, collapse with the arrows.">
    <ej2-splitter data-testid="sp-horizontal" view-model.ref="splitter" e-model.bind="horizontalModel" e-on-collapsed.delegate="onCollapsed()"
      e-on-expanded.delegate="onExpanded()" e-on-resize-stop.delegate="onResizeStop()">
      <div data-testid="sp-left" style="padding: 8px">Left pane</div>
      <div data-testid="sp-right" style="padding: 8px">Right pane</div>
    </ej2-splitter>
    <div class="demo-row">
      <button data-testid="sp-collapse" click.delegate="collapseLeft()">Collapse left</button>
      <button data-testid="sp-expand" click.delegate="expandLeft()">Expand left</button>
    </div>
    <div class="demo-output">Collapsed: <span data-testid="sp-collapsed">${collapsed}</span>
      Expanded: <span data-testid="sp-expanded">${expanded}</span> Resize stops: <span data-testid="sp-resized">${resizeStops}</span></div>
  </demo-section>

  <demo-section id="sp-nested" title="Nested vertical splitter" description="A vertical splitter inside a horizontal pane.">
    <ej2-splitter data-testid="sp-nested" e-model.bind="horizontalModel">
      <div style="padding: 8px">Left</div>
      <div>
        <ej2-splitter e-model.bind="verticalModel" e-height="200px">
          <div style="padding: 8px">Top</div>
          <div style="padding: 8px">Bottom</div>
        </ej2-splitter>
      </div>
    </ej2-splitter>
  </demo-section>
</template>
