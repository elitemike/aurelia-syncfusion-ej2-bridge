<template>
  <h2>Drop Down Button</h2>

  <demo-section id="ddb-basic" title="Default" description="items, content, icon, css class, disabled, popup width and all events.">
    <ej2-drop-down-button data-testid="ddb-basic" e-items.bind="items" e-content.bind="content" e-icon-css="e-icons e-user" e-icon-position.bind="iconPosition"
      e-css-class="ddb-basic-class" e-disabled.bind="disabled" e-popup-width="220px" e-enable-html-sanitizer.bind="true"
      e-on-created.delegate="created = created + 1" e-on-before-item-render.delegate="itemRenders = itemRenders + 1"
      e-on-before-open.delegate="beforeOpen = beforeOpen + 1" e-on-open.delegate="opened = opened + 1"
      e-on-before-close.delegate="beforeClose = beforeClose + 1" e-on-close.delegate="closed = closed + 1"
      e-on-select.delegate="selected = $event.detail.item.text"></ej2-drop-down-button>
    <div class="demo-row">
      <button data-testid="ddb-content" click.delegate="content = 'Account'">Change content</button>
      <label>Icon position
        <select data-testid="ddb-icon-position" value.bind="iconPosition"><option value="Left">Left</option><option value="Right">Right</option><option value="Top">Top</option></select>
      </label>
      <label><input type="checkbox" data-testid="ddb-chk-disabled" checked.bind="disabled" /> disabled</label>
    </div>
    <div class="demo-output">created <span data-testid="ddb-created">${created}</span> beforeItemRender <span data-testid="ddb-item-renders">${itemRenders}</span>
      beforeOpen <span data-testid="ddb-before-open">${beforeOpen}</span> open <span data-testid="ddb-opened">${opened}</span>
      beforeClose <span data-testid="ddb-before-close">${beforeClose}</span> close <span data-testid="ddb-closed">${closed}</span>
      select <code data-testid="ddb-selected">${selected}</code></div>
  </demo-section>

  <demo-section id="ddb-default-slot" title="Content from the element body" description="Without content the text of the element is the button text.">
    <ej2-drop-down-button data-testid="ddb-slot" e-items.bind="items" e-css-class="ddb-slot-class">Slot text</ej2-drop-down-button>
  </demo-section>

  <demo-section id="ddb-target" title="Custom popup content" description="target uses an element as the popup, createPopupOnClick delays rendering, closeActionEvents controls what closes it.">
    <ej2-drop-down-button data-testid="ddb-target" e-target="#ddb-target-content" e-create-popup-on-click.bind="true" e-close-action-events="click" e-css-class="ddb-target-class">Show panel</ej2-drop-down-button>
    <div id="ddb-target-content" data-testid="ddb-target-content" style="display: none; padding: 10px;"><span class="ddb-panel">Custom panel content</span></div>
  </demo-section>

  <demo-section id="ddb-template" title="Item template and animation" description="itemTemplate renders every item, animationSettings configures the popup animation.">
    <ej2-drop-down-button data-testid="ddb-template" e-items.bind="items" e-item-template.bind="itemTemplate" e-animation-settings.bind="animation" e-css-class="ddb-template-class">Templated</ej2-drop-down-button>
  </demo-section>

  <demo-section id="ddb-html" title="Html content" description="enableHtmlSanitizer sanitizes the content.">
    <ej2-drop-down-button data-testid="ddb-html" e-items.bind="items" e-content.bind="htmlContent" e-enable-html-sanitizer.bind="true" e-css-class="ddb-html-class"></ej2-drop-down-button>
  </demo-section>
</template>
