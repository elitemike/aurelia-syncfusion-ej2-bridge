<template>
  <h2>Pager</h2>

  <demo-section id="pg-current" title="Two-way current page" description="Clicking the pager updates currentPage, the view-model can move the pager. totalRecordsCount and pageSize follow the view-model.">
    <ej2-pager data-testid="pg-current" e-total-records-count.two-way="total" e-page-size.bind="pageSize"
      e-current-page.two-way="currentPage" e-on-click.delegate="onClick()"></ej2-pager>
    <div class="demo-output">Current page: <code data-testid="pg-current-out">${currentPage}</code>
      Clicks: <span data-testid="pg-click-count">${clickCount}</span></div>
    <button data-testid="pg-goto-5" click.delegate="goTo(5)">Go to page 5</button>
    <button data-testid="pg-size-20" click.delegate="setPageSize(20)">Page size 20</button>
    <button data-testid="pg-total-50" click.delegate="setTotal(50)">Total 50</button>
  </demo-section>

  <demo-section id="pg-size" title="Page sizes" description="pageSizes adds a page size dropdown, pageCount sets the number of numeric buttons. dropDownChanged and created are reported.">
    <ej2-pager data-testid="pg-size" e-total-records-count.bind="total" e-page-size.bind="10"
      e-page-sizes.bind="[10, 20, 50]" e-page-count.bind="pageCount" e-on-created.delegate="onCreated()"
      e-on-drop-down-changed.delegate="onDropDownChanged($event)"></ej2-pager>
    <div class="demo-output">Created: <span data-testid="pg-created">${createdCount}</span>
      Dropdown changes: <span data-testid="pg-dd-count">${dropDownChangedCount}</span>
      Size: <span data-testid="pg-dd-size">${lastDropDownSize}</span></div>
    <button data-testid="pg-count-5" click.delegate="pageCount = 5">Page count 5</button>
  </demo-section>

  <demo-section id="pg-message" title="External message" description="enableExternalMessage and externalMessage add custom text.">
    <ej2-pager data-testid="pg-message" e-total-records-count.bind="45" e-page-size.bind="10"
      e-enable-external-message.bind="true" e-external-message="Custom pager message"></ej2-pager>
  </demo-section>

  <demo-section id="pg-look" title="Look and feel" description="cssClass, customText, enablePagerMessage and enableQueryString (enablePagerMessage=false triggers a Syncfusion resize error, so it stays true).">
    <ej2-pager data-testid="pg-look" e-total-records-count.bind="45" e-page-size.bind="10" e-css-class="my-pager"
      e-custom-text="Pg " e-enable-pager-message.bind="true" e-enable-query-string.bind="false"></ej2-pager>
  </demo-section>

  <demo-section id="pg-template" title="Template" description="template replaces the default pager elements.">
    <ej2-pager data-testid="pg-template" e-total-records-count.bind="45" e-page-size.bind="10" e-template.bind="tpl"></ej2-pager>
  </demo-section>
</template>
