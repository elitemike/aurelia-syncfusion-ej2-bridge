<template>
  <h2>DropDownList</h2>

  <demo-section id="ddl-model" title="Model binding" description="Whole widget configuration through e-model.">
    <ej2-drop-down-list data-testid="ddl-model" e-model.bind="model"></ej2-drop-down-list>
  </demo-section>

  <demo-section id="ddl-value" title="Two-way value" description="e-value.two-way stays in sync with the selection, in both directions.">
    <ej2-drop-down-list data-testid="ddl-value" e-data-source.bind="sports" e-fields.bind="fields" e-value.two-way="value"
      e-enabled.bind="enabled" e-on-change.delegate="onChange($event)" e-show-clear-button="true"></ej2-drop-down-list>
    <div class="demo-output">
      Value: <code data-testid="ddl-value-out">${value}</code>
      Changes: <span data-testid="ddl-change-count">${changeCount}</span>
    </div>
    <div class="demo-row">
      <button data-testid="ddl-set-game1" click.delegate="setValue('Game1')">Set American Football</button>
      <label><input type="checkbox" data-testid="ddl-enabled" checked.bind="enabled" /> enabled</label>
    </div>
  </demo-section>

  <demo-section id="ddl-filter" title="Filtering" description="allowFiltering shows a filter bar in the popup.">
    <ej2-drop-down-list data-testid="ddl-filter" e-data-source.bind="sports" e-fields.bind="fields" e-allow-filtering="true"
      e-placeholder="Filter sports"></ej2-drop-down-list>
  </demo-section>

  <demo-section id="ddl-select" title="From &lt;select&gt;" description="Existing markup in the element body is used as the data source.">
    <ej2-drop-down-list data-testid="ddl-select" e-placeholder="Select a game">
      <select>
        <option value="g1">Golf</option>
        <option value="g2">Hockey</option>
        <option value="g3">Rugby</option>
      </select>
    </ej2-drop-down-list>
  </demo-section>
</template>
