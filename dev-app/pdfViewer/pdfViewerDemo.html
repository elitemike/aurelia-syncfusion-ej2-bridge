<template>
  <h2>Pdf Viewer</h2>

  <demo-section id="pv-main" title="Viewer with toolbar, annotations and every event"
    description="A local base64 document rendered by pdfium from resourceUrl. All viewer events are logged. currentPageNumber and zoomValue are two-way, pageCount and isDocumentEdited are read back (from-view).">
    <div class="demo-row">
      <button data-testid="pv-next" click.delegate="next()">Next page</button>
      <button data-testid="pv-goto3" click.delegate="currentPage = 3">currentPage = 3</button>
      <button data-testid="pv-zoom150" click.delegate="zoom = 150">zoom = 150</button>
      <button data-testid="pv-toggle-toolbar" click.delegate="showToolbar = !showToolbar">Toggle toolbar</button>
      <span>Page <code data-testid="pv-page-out">${currentPage}</code> of <code data-testid="pv-count-out">${pageCount}</code>
        zoom <code data-testid="pv-zoom-out">${zoom}</code> edited <code data-testid="pv-edited-out">${edited}</code></span>
    </div>
    <ej2-pdf-viewer data-testid="pv-main" view-model.ref="viewer"
      e-document-path.bind="documentPath" e-resource-url.bind="resourceUrl" e-height="560px" e-width="100%"
      e-enable-toolbar.bind="showToolbar" e-enable-navigation-toolbar.bind="true" e-enable-thumbnail.bind="true"
      e-enable-bookmark.bind="true" e-enable-hyperlink.bind="true" e-enable-navigation.bind="true"
      e-enable-magnification.bind="true" e-enable-text-selection.bind="true" e-enable-text-search.bind="true"
      e-enable-annotation.bind="true" e-enable-form-fields.bind="true" e-enable-form-designer.bind="true"
      e-enable-annotation-toolbar.bind="true" e-enable-print.bind="true" e-enable-download.bind="true"
      e-enable-comment-panel.bind="true" e-hyperlink-open-state="NewTab" e-is-extract-text.bind="true"
      e-download-file-name="demo.pdf" e-export-annotation-file-name="demo-annotations"
      e-current-page-number.two-way="currentPage" e-zoom-value.two-way="zoom"
      e-toolbar-settings.bind="toolbarSettings" e-command-manager.bind="commandManager"
      e-custom-context-menu-items.bind="customMenu" e-enable-form-fields-validation.bind="true"
      e-page-count.from-view="pageCount" e-is-document-edited.from-view="edited"
      e-on-created.delegate="log('created', $event)"
      e-on-resources-loaded.delegate="log('resourcesLoaded', $event)"
      e-on-document-load.delegate="log('documentLoad', $event)"
      e-on-document-unload.delegate="log('documentUnload', $event)"
      e-on-document-load-failed.delegate="log('documentLoadFailed', $event)"
      e-on-ajax-request-failed.delegate="log('ajaxRequestFailed', $event)"
      e-on-ajax-request-success.delegate="log('ajaxRequestSuccess', $event)"
      e-on-page-render-complete.delegate="log('pageRenderComplete', $event)"
      e-on-validate-form-fields.delegate="log('validateFormFields', $event)"
      e-on-page-click.delegate="log('pageClick', $event)"
      e-on-page-change.delegate="log('pageChange', $event)"
      e-on-hyperlink-click.delegate="log('hyperlinkClick', $event)"
      e-on-hyperlink-mouse-over.delegate="log('hyperlinkMouseOver', $event)"
      e-on-zoom-change.delegate="log('zoomChange', $event)"
      e-on-annotation-add.delegate="log('annotationAdd', $event)"
      e-on-annotation-remove.delegate="log('annotationRemove', $event)"
      e-on-annotation-properties-change.delegate="log('annotationPropertiesChange', $event)"
      e-on-annotation-changed.delegate="log('annotationChanged', $event)"
      e-on-annotation-resize.delegate="log('annotationResize', $event)"
      e-on-add-signature.delegate="log('addSignature', $event)"
      e-on-remove-signature.delegate="log('removeSignature', $event)"
      e-on-move-signature.delegate="log('moveSignature', $event)"
      e-on-signature-properties-change.delegate="log('signaturePropertiesChange', $event)"
      e-on-resize-signature.delegate="log('resizeSignature', $event)"
      e-on-signature-select.delegate="log('signatureSelect', $event)"
      e-on-signature-unselect.delegate="log('signatureUnselect', $event)"
      e-on-annotation-select.delegate="log('annotationSelect', $event)"
      e-on-annotation-un-select.delegate="log('annotationUnSelect', $event)"
      e-on-annotation-double-click.delegate="log('annotationDoubleClick', $event)"
      e-on-annotation-move.delegate="log('annotationMove', $event)"
      e-on-annotation-moving.delegate="log('annotationMoving', $event)"
      e-on-annotation-mouseover.delegate="log('annotationMouseover', $event)"
      e-on-annotation-mouse-leave.delegate="log('annotationMouseLeave', $event)"
      e-on-page-mouseover.delegate="log('pageMouseover', $event)"
      e-on-import-start.delegate="log('importStart', $event)"
      e-on-export-start.delegate="log('exportStart', $event)"
      e-on-import-success.delegate="log('importSuccess', $event)"
      e-on-export-success.delegate="log('exportSuccess', $event)"
      e-on-import-failed.delegate="log('importFailed', $event)"
      e-on-export-failed.delegate="log('exportFailed', $event)"
      e-on-extract-text-completed.delegate="log('extractTextCompleted', $event)"
      e-on-thumbnail-click.delegate="log('thumbnailClick', $event)"
      e-on-bookmark-click.delegate="log('bookmarkClick', $event)"
      e-on-toolbar-click.delegate="log('toolbarClick', $event)"
      e-on-text-selection-start.delegate="log('textSelectionStart', $event)"
      e-on-text-selection-end.delegate="log('textSelectionEnd', $event)"
      e-on-download-start.delegate="log('downloadStart', $event)"
      e-on-button-field-click.delegate="log('buttonFieldClick', $event)"
      e-on-form-field-click.delegate="log('formFieldClick', $event)"
      e-on-download-end.delegate="log('downloadEnd', $event)"
      e-on-print-start.delegate="log('printStart', $event)"
      e-on-print-end.delegate="log('printEnd', $event)"
      e-on-text-search-start.delegate="log('textSearchStart', $event)"
      e-on-text-search-complete.delegate="log('textSearchComplete', $event)"
      e-on-text-search-highlight.delegate="log('textSearchHighlight', $event)"
      e-on-ajax-request-initiate.delegate="log('ajaxRequestInitiate', $event)"
      e-on-page-render-initiate.delegate="log('pageRenderInitiate', $event)"
      e-on-comment-add.delegate="log('commentAdd', $event)"
      e-on-comment-edit.delegate="log('commentEdit', $event)"
      e-on-comment-delete.delegate="log('commentDelete', $event)"
      e-on-comment-select.delegate="log('commentSelect', $event)"
      e-on-comment-status-changed.delegate="log('commentStatusChanged', $event)"
      e-on-before-add-free-text.delegate="log('beforeAddFreeText', $event)"
      e-on-form-field-focus-out.delegate="log('formFieldFocusOut', $event)"
      e-on-form-field-add.delegate="log('formFieldAdd', $event)"
      e-on-form-field-remove.delegate="log('formFieldRemove', $event)"
      e-on-form-field-properties-change.delegate="log('formFieldPropertiesChange', $event)"
      e-on-form-field-changed.delegate="log('formFieldChanged', $event)"
      e-on-form-field-mouse-leave.delegate="log('formFieldMouseLeave', $event)"
      e-on-form-field-mouseover.delegate="log('formFieldMouseover', $event)"
      e-on-form-field-move.delegate="log('formFieldMove', $event)"
      e-on-form-field-resize.delegate="log('formFieldResize', $event)"
      e-on-form-field-select.delegate="log('formFieldSelect', $event)"
      e-on-form-field-unselect.delegate="log('formFieldUnselect', $event)"
      e-on-form-field-double-click.delegate="log('formFieldDoubleClick', $event)"
      e-on-custom-context-menu-select.delegate="log('customContextMenuSelect', $event)"
      e-on-custom-context-menu-before-open.delegate="log('customContextMenuBeforeOpen', $event)"
      e-on-keyboard-custom-commands.delegate="log('keyboardCustomCommands', $event)"
      e-on-page-organizer-save-as.delegate="log('pageOrganizerSaveAs', $event)"
      e-on-page-organizer-saved.delegate="log('pageOrganizerSaved', $event)"
      e-on-document-changed.delegate="log('documentChanged', $event)"
      e-on-page-organizer-zoom-changed.delegate="log('pageOrganizerZoomChanged', $event)"
      e-on-before-web-mcp-tool-execute.delegate="log('beforeWebMcpToolExecute', $event)"></ej2-pdf-viewer>
  </demo-section>

  <compose repeat.for="part of parts" view-model.bind="part"></compose>
</template>
