<template>
  <h2>Button</h2>

  <demo-section id="button-default" title="Default" description="Content comes from the element body via slot.">
    <ej2-button data-testid="btn-default">My Button</ej2-button>
  </demo-section>

  <demo-section id="button-click" title="Click event" description="on-click is re-dispatched from the wrapper element.">
    <ej2-button data-testid="btn-click" on-click.delegate="onClick()">Click me</ej2-button>
    <div class="demo-output">Clicks: <span data-testid="btn-click-count">${clickCount}</span></div>
  </demo-section>

  <demo-section id="button-properties" title="Bound properties" description="disabled, isPrimary and isToggle follow the view-model.">
    <div class="demo-row">
      <ej2-button data-testid="btn-bound" e-disabled.bind="disabled" e-is-primary.bind="isPrimary" e-is-toggle.bind="isToggle">Bound</ej2-button>
      <label><input type="checkbox" data-testid="chk-disabled" checked.bind="disabled" /> disabled</label>
      <label><input type="checkbox" data-testid="chk-primary" checked.bind="isPrimary" /> primary</label>
      <label><input type="checkbox" data-testid="chk-toggle" checked.bind="isToggle" /> toggle</label>
    </div>
  </demo-section>

  <demo-section id="button-icon" title="Icon" description="iconCss and iconPosition.">
    <ej2-button data-testid="btn-icon" e-icon-css="e-icons e-add" e-icon-position="Right">Add</ej2-button>
  </demo-section>

  <demo-section id="button-content" title="Content, css class, rtl and created" description="content, cssClass, enableRtl, enableHtmlSanitizer and the created event.">
    <ej2-button data-testid="btn-content" e-content.bind="content" e-css-class.bind="cssClass" e-enable-rtl.bind="rtl"
      e-enable-html-sanitizer.bind="false" e-on-created.delegate="createdCount = createdCount + 1"></ej2-button>
    <div class="demo-output">Created: <span data-testid="btn-created">${createdCount}</span></div>
    <div class="demo-row">
      <button data-testid="btn-content-change" click.delegate="content = 'Updated content'">Change content</button>
      <button data-testid="btn-css-change" click.delegate="cssClass = 'btn-custom-two'">Change cssClass</button>
      <label><input type="checkbox" data-testid="btn-rtl" checked.bind="rtl" /> rtl</label>
    </div>
  </demo-section>

  <demo-section id="button-repeat" title="Hold to repeat" description="enableRepeat, repeatDelay and repeatInterval raise clicked repeatedly while the button is held.">
    <ej2-button data-testid="btn-repeat" e-enable-repeat.bind="true" e-repeat-delay.bind="100" e-repeat-interval.bind="50"
      e-on-clicked.delegate="onClicked($event)">Hold me</ej2-button>
    <div class="demo-output">Clicked: <span data-testid="btn-clicked">${clickedCount}</span>
      Repeats: <span data-testid="btn-repeats">${repeatCount}</span></div>
  </demo-section>

  <demo-section id="button-lifecycle" title="Lifecycle" description="Widget is destroyed and recreated with if.bind.">
    <ej2-button if.bind="showButton" data-testid="btn-lifecycle">I come and go</ej2-button>
    <ej2-button data-testid="btn-lifecycle-toggle" on-click.delegate="toggleLifecycle()">Toggle</ej2-button>
  </demo-section>
</template>
